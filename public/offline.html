<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>Offline · EHS Studio Manager</title>
  <link rel="icon" href="/icons/favicon-32.png" />
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #FAFAF9; color: #111110; font-family: -apple-system, BlinkMacSystemFont, 'DM Sans', sans-serif; padding: 24px; box-sizing: border-box; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-family: Georgia, serif; font-weight: 400; font-size: 26px; margin: 20px 0 8px; }
    p { color: #7F7E7C; line-height: 1.6; font-size: 15px; margin: 0 0 24px; }
    button { border: 0; border-radius: 10px; background: #111110; color: #fff; font: inherit; font-weight: 600; padding: 13px 26px; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>EHS Studio Manager needs a connection to load your studio. Check your Wi-Fi or mobile data and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener('online', () => location.reload())</script>
</body>
</html>
